server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/shop
    username: shop
    password:
  sql:
    init:
      mode: always
      continue-on-error: false

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp


shop:
  currency: USD
  tax-rate: 0.10
  low-stock-threshold: 5


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [req:%X{requestId:--}] %-5level %logger{36} - %msg%n"